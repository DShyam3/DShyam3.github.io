# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

# Every `uses:` below is pinned to a commit SHA, not a tag. A tag like `v4` is
# mutable -- whoever controls the action repo can repoint it at new code, and
# that code runs with this workflow's secrets. The trailing comment records
# which release the SHA was, so bumping stays readable.
jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      VITE_TMDB_IMAGE_BASE_URL: ${{ secrets.VITE_TMDB_IMAGE_BASE_URL }}
      VITE_ADMIN_EMAIL: ${{ secrets.VITE_ADMIN_EMAIL }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        # `ci`, not `install`: it installs exactly what package-lock.json says
        # and fails if the lock and manifest disagree, so a deploy cannot
        # silently pick up a different dependency tree than the one tested.
        run: npm ci

      # These are read at build time with no fallback, so a missing one is
      # baked into the bundle as `undefined` and ships a site where nothing
      # loads. This used to print "MISSING" and carry on regardless; it fails
      # the deploy now. VITE_ADMIN_EMAIL is deliberately absent -- it has a
      # default in AuthContext and is the one that can go without.
      - name: Verify Env
        run: |
          missing=""
          for name in VITE_SUPABASE_URL VITE_SUPABASE_PUBLISHABLE_KEY VITE_TMDB_IMAGE_BASE_URL; do
            if [ -z "${!name}" ]; then
              missing="$missing $name"
              echo "::error::$name is MISSING"
            else
              echo "$name is set"
            fi
          done
          if [ -n "$missing" ]; then
            echo "Refusing to build without:$missing"
            exit 1
          fi

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@1f0c5cde4bc74cd7e1254d0cb4de8d49e9068c7d # v4
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          # Upload entire repository
          path: './dist'
      
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
