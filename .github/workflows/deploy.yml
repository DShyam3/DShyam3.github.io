# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

# Every `uses:` below is pinned to a commit SHA, not a tag. A tag like `v4` is
# mutable -- whoever controls the action repo can repoint it at new code, and
# that code runs with this workflow's secrets. The trailing comment records
# which release the SHA was, so bumping stays readable.
jobs:
  # Build and package the static site into a Pages artifact
  build:
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      VITE_TMDB_IMAGE_BASE_URL: ${{ secrets.VITE_TMDB_IMAGE_BASE_URL }}
      VITE_ADMIN_EMAIL: ${{ secrets.VITE_ADMIN_EMAIL }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: 'npm'

      - name: Set up Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: 2.7.5

      - name: Install dependencies
        # `ci`, not `install`: it installs exactly what package-lock.json says
        # and fails if the lock and manifest disagree, so a deploy cannot
        # silently pick up a different dependency tree than the one tested.
        run: npm ci

      # These are read at build time with no fallback, so a missing one is
      # baked into the bundle as `undefined` and ships a site where nothing
      # loads. This used to print "MISSING" and carry on regardless; it fails
      # the deploy now.
      - name: Verify Env
        run: |
          missing=""
          for name in VITE_SUPABASE_URL VITE_SUPABASE_PUBLISHABLE_KEY VITE_TMDB_IMAGE_BASE_URL VITE_ADMIN_EMAIL; do
            if [ -z "${!name}" ]; then
              missing="$missing $name"
              echo "::error::$name is MISSING"
            else
              echo "$name is set"
            fi
          done
          if [ -n "$missing" ]; then
            echo "Refusing to build without:$missing"
            exit 1
          fi

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Typecheck Edge Functions
        run: npm run typecheck:functions

      - name: Test Edge Function modules
        run: npm run test:functions

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          # Upload entire repository
          path: './dist'
      
  # Deploy the uploaded artifact to GitHub Pages.
  # Running in a separate job ensures artifact indexing has completed and prevents
  # duplicate artifact uploads on job re-run.
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
