# Local development stack configuration.
#
# `project_id` is the only line the CLI strictly needs for `supabase link`, but
# leaving it at that means `supabase start` comes up with defaults that do not
# resemble this project -- wrong Postgres major, signup enabled, no site URL.
# What follows mirrors production closely enough that a local stack is worth
# starting.
#
# Note the split: this file configures the LOCAL stack. The hosted project is
# configured in the dashboard. Where the two disagree, the dashboard wins for
# production -- see SECURITY.md for the settings that are still only set there.

project_id = "yvtiybyuifkiwyrnjebe"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
# The site reads whole tables (a few hundred rows at most). This cap exists so
# an unbounded query cannot become an unbounded response.
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
# Production runs Postgres 15 (supabase-postgres-15.8.x). Matching it locally is
# the point of pinning this -- a 17 shadow database will happily accept SQL that
# production rejects.
major_version = 15

[db.pooler]
enabled = false

[studio]
enabled = true
port = 54323

# Catches outbound mail locally instead of sending it.
[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
# The `photos` and `documents` buckets both cap at 50 MB in production.
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:8080"
additional_redirect_urls = ["https://dshyam3.github.io"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
# Single-account site: every RLS policy checks one admin email, so a
# self-registered account gets nothing. Signup is off here; it is still ON in
# the hosted project and should be turned off in the dashboard (S-6).
enable_signup = false

[auth.email]
enable_signup = false
double_confirm_changes = true
enable_confirmations = false

[analytics]
enabled = false
