<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dhyan's website</title>
  <meta name="description" content="A curated collection of my cherished things, books, and thoughts." />
  <meta name="author" content="Dhyan Shyam" />
  <!-- Referrer-Policy: GitHub Pages cannot set response headers, so it is declared here. -->
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <link rel="canonical" href="https://dshyam3.github.io/" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Doto:wght@400;500;600;700;800;900&family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet" />

  <!-- Supabase storage (site-assets bucket: hero image, icons, dot-matrix data) -->
  <link rel="preconnect" href="https://yvtiybyuifkiwyrnjebe.supabase.co" crossorigin />

  <meta property="og:title" content="Dhyan's website" />
  <meta property="og:description" content="A curated collection of my cherished things, books, and thoughts." />
  <meta property="og:type" content="website" />
  <!-- Absolute, because Open Graph scrapers do not resolve relative URLs.
       The card itself is generated by scripts/generate-og-image.py — rerun it
       if the wordmark or the light-theme palette changes. -->
  <meta property="og:url" content="https://dshyam3.github.io/" />
  <meta property="og:image" content="https://dshyam3.github.io/og-image.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="Dhyan Shyam — my digital garden" />

  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:site" content="@DhyanShyam" />
  <meta name="twitter:image" content="https://dshyam3.github.io/og-image.png" />

  <!-- Umami Analytics -->
  <script defer src="https://cloud.umami.is/script.js" data-website-id="824d16a6-3ee4-4ead-b20f-4a6d4ec9d682"></script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
