<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>%SITE_TITLE%</title>
  <meta name="description" content="%SITE_DESCRIPTION%" />
  <meta name="author" content="%SITE_AUTHOR%" />
  <!-- Referrer-Policy: GitHub Pages cannot set response headers, so it is declared here. -->
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <link rel="canonical" href="%SITE_URL%" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Doto:wght@400;500;600;700;800;900&family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet" />

  <!-- Supabase storage (site-assets bucket: hero image, icons, dot-matrix data) -->
  <link rel="preconnect" href="%VITE_SUPABASE_URL%" crossorigin />

  <meta property="og:title" content="%SITE_TITLE%" />
  <meta property="og:description" content="%SITE_DESCRIPTION%" />
  <meta property="og:type" content="website" />
  <!-- Absolute, because Open Graph scrapers do not resolve relative URLs.
       The card itself is generated by scripts/generate-og-image.py — rerun it
       if the wordmark or the light-theme palette changes. -->
  <meta property="og:url" content="%SITE_URL%" />
  <meta property="og:image" content="%SITE_OG_IMAGE%" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="%SITE_OG_IMAGE_ALT%" />

  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:site" content="%SITE_TWITTER_HANDLE%" />
  <meta name="twitter:image" content="%SITE_OG_IMAGE%" />
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
